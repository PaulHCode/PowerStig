name: Machine Configuration foundations

on:
  push:
    paths:
      - 'Tools/AzureMachineConfiguration/**'
      - 'Tests/Unit/Tools/AzureMachineConfiguration/**'
      - '.github/workflows/machine-configuration.yml'
  pull_request:
    paths:
      - 'Tools/AzureMachineConfiguration/**'
      - 'Tests/Unit/Tools/AzureMachineConfiguration/**'
      - '.github/workflows/machine-configuration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing pinned authoring and test tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'PowerStigModules'
          $null = New-Item -Path $toolRoot -ItemType Directory -Force
          $env:PSModulePath = "$toolRoot$([System.IO.Path]::PathSeparator)$env:PSModulePath"
          foreach ($dependency in @(
              @{ Name = 'Pester'; Version = '5.3.1' },
              @{ Name = 'GuestConfiguration'; Version = '4.10.0' }
          )) {
              if (-not (Get-Module -ListAvailable -Name $dependency.Name |
                  Where-Object Version -EQ ([version]$dependency.Version))) {
                  Save-Module -Name $dependency.Name -RequiredVersion $dependency.Version -Path $toolRoot -Repository PSGallery -Force -ErrorAction Stop
              }
          }
      - name: Run offline integration foundations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'PowerStigModules'
          $env:PSModulePath = "$toolRoot$([System.IO.Path]::PathSeparator)$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.3.1
          $result = Invoke-Pester -Path .\Tests\Unit\Tools\AzureMachineConfiguration -Output Detailed -PassThru
          if ($result.Result -ne 'Passed' -or $result.SkippedCount -gt 0 -or $result.PassedCount -eq 0) {
              throw 'Machine Configuration offline validation failed or did not run completely.'
          }

  windows-worker:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned worker authoring tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'PowerStigWorkerModules'
          $null = New-Item -Path $toolRoot -ItemType Directory -Force
          foreach ($dependency in @(
                @{ Name = 'GuestConfiguration'; Version = '4.10.0' },
                @{ Name = 'PSDesiredStateConfiguration'; Version = '2.0.7' }
          )) {
                Save-Module -Name $dependency.Name -RequiredVersion $dependency.Version -Path $toolRoot -Repository PSGallery -Force -ErrorAction Stop
          }
      - name: Test Audit package on the ephemeral runner only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'PowerStigWorkerModules'
          $env:PSModulePath = "$toolRoot$([System.IO.Path]::PathSeparator)$env:PSModulePath"
          $output = Join-Path $env:RUNNER_TEMP 'PowerStigWorkerRun'
          $start = [Diagnostics.ProcessStartInfo]::new((Get-Command pwsh).Source)
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($argument in @('-NoLogo', '-NoProfile', '-File', "$env:GITHUB_WORKSPACE\Tools\AzureMachineConfiguration\Test-HostedFleetWorker.ps1", '-OutputPath', $output)) {
                $start.ArgumentList.Add($argument)
          }
          $process = [Diagnostics.Process]::Start($start)
          $stdout = $process.StandardOutput.ReadToEndAsync()
          $stderr = $process.StandardError.ReadToEndAsync()
          if (-not $process.WaitForExit(480000)) {
                $process.Kill($true)
                throw 'Hosted worker exceeded its eight-minute bound.'
          }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\worker.private.stdout", $stdout.GetAwaiter().GetResult())
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\worker.private.stderr", $stderr.GetAwaiter().GetResult())
          if ($process.ExitCode -ne 0) {
                throw 'Hosted worker validation failed. Raw logs remain local to the ephemeral runner; inspect the scalar-redacted summary if present.'
          }
      - name: Retain scalar-redacted worker shape only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-worker-shape
          path: |
            ${{ runner.temp }}\PowerStigWorkerRun\worker-summary.json
            ${{ runner.temp }}\PowerStigWorkerRun\worker-failure.json
          if-no-files-found: warn
          retention-days: 7
